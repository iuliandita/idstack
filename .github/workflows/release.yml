name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Check manifest versions match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "${TAG#v}" <<'PY'
          import json, sys
          want = sys.argv[1]
          marketplace = {p["name"]: p for p in json.load(open(".claude-plugin/marketplace.json"))["plugins"]}
          found = {
              "plugin.json": json.load(open("plugin.json"))["version"],
              ".claude-plugin/plugin.json": json.load(open(".claude-plugin/plugin.json"))["version"],
              ".claude-plugin/marketplace.json": marketplace["idstack"]["version"],
          }
          bad = {k: v for k, v in found.items() if v != want}
          for path, version in bad.items():
              print(f"::error::{path} has version {version}, tag says {want}")
          sys.exit(1 if bad else 0)
          PY

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          prerelease=()
          case "$TAG" in v0.*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
