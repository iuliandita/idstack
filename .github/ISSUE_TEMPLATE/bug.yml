name: Bug report
description: Report a reproducible installer, plugin, or playbook problem.
body:
  - type: markdown
    attributes:
      value: "For suspected vulnerabilities, use SECURITY.md and private security reporting. Redact secrets, hosts, and private paths."
  - type: input
    id: version
    attributes:
      label: idstack version or commit
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness, version, and OS
      description: Claude Code, Codex, or OpenCode, plus the pstack version or mirror commit.
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Install mode and affected component
      description: install.sh (with flags), manual marketplace install, or skills CLI; installer, router, playbook, or overlay.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction, expected behavior, and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs and `./install.sh --check` output
